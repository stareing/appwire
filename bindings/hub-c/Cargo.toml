[package]
name = "app-mcp-hub-c"
description = "AppWire Hub C ABI for embedding the hub in C, C++ and C# agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
name = "app_mcp_hub"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# 依赖重命名为 hub：本库名也是 app_mcp_hub（任务约定），避免与 crates/hub 的库名冲突。
hub = { package = "app-mcp-hub", path = "../../crates/hub" }
app-mcp-manifest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
app-mcp-native.workspace = true
