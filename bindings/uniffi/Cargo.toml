[package]
name = "app-mcp-uniffi"
description = "AppWire bindings for Kotlin, Swift and Python apps (UniFFI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
name = "app_mcp_uniffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
# `cli` 只给 uniffi-bindgen 用；交叉编译移动端库时用 --no-default-features 省掉 bindgen 依赖。
default = ["cli"]
cli = ["uniffi/cli"]

[dependencies]
app-mcp-native.workspace = true
uniffi = { workspace = true }
thiserror.workspace = true
# 事件声明的 payloadSchema 文本 → JSON 值（`EventInfo`）。
serde_json.workspace = true

[dev-dependencies]
# 测试用 test_support::fake_host_path() 构建并定位 examples/fake_host。
app-mcp-native = { workspace = true, features = ["test-support"] }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
