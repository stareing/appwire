[package]
name = "app-mcp-node"
description = "app-mcp 原生 SDK 的 Node 绑定（napi-rs），供 @app-mcp/node 使用"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# N-API 符号由加载模块的 node 进程提供，Rust 单元测试可执行文件无法链接 / 加载；
# 本 crate 由 packages/node 的 vitest（封装层 + 集成测试）覆盖。
test = false
doctest = false

[dependencies]
app-mcp-native.workspace = true
serde_json.workspace = true
napi = { workspace = true, features = ["napi8", "serde-json"] }
napi-derive.workspace = true

[build-dependencies]
napi-build.workspace = true
