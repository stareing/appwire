[package]
name = "app-mcp-hub-node"
description = "AppWire Hub Node.js native module (napi-rs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# N-API 符号由加载模块的 node 进程提供，Rust 单元测试可执行文件无法链接 / 加载；
# 本 crate 由 packages/hub 的 vitest 集成测试覆盖。
test = false
doctest = false

[dependencies]
app-mcp-hub.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
napi = { workspace = true, features = ["napi8", "serde-json", "tokio_rt"] }
napi-derive.workspace = true

[build-dependencies]
napi-build.workspace = true
