[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "app-mcp"
version = "0.1.0"
description = "AppWire Python SDK: expose Python app actions (Qt, Tk, asyncio) as MCP tools for AI agents such as Claude, ChatGPT and Gemini"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "mcp-server", "ai-agent", "llm", "tool-calling", "function-calling", "claude", "pyqt", "tkinter", "appwire"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2"]
# Linux D-Bus 唤醒服务（app_mcp.linux.serve_dbus_wake）
dbus = ["jeepney>=0.8"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/stareing/appwire"
Repository = "https://github.com/stareing/appwire"
Issues = "https://github.com/stareing/appwire/issues"
Documentation = "https://github.com/stareing/appwire/tree/main/sdks/python"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 由 bindings/uniffi/scripts/generate.sh 放入包目录的原生库
app_mcp = ["*.so", "*.dylib", "*.dll"]
# 由 bindings/hub-uniffi/scripts/generate.sh 放入包目录（Hub SDK，app_mcp.hub 使用）
app_mcp_hub = ["*.so", "*.dylib", "*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: 需要 cargo 与 fake_host 的集成测试",
    "hub: 需要 hub-uniffi 生成物（app_mcp_hub）的 Hub SDK 测试",
]
