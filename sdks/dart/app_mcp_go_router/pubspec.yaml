name: app_mcp_go_router
description: "AppWire go_router adapter: let AI agents navigate a Flutter app's go_router pages before calling page-level MCP tools."
homepage: https://github.com/stareing/appwire
repository: https://github.com/stareing/appwire/tree/main/sdks/dart/app_mcp_go_router
issue_tracker: https://github.com/stareing/appwire/issues
topics: [mcp, ai, llm, agent, go-router]
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  app_mcp_flutter:
    path: ../app_mcp_flutter
  go_router: ">=14.0.0 <18.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
