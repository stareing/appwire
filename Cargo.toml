[workspace]
resolver = "3"
members = [
  "crates/protocol",
  "crates/core",
  "crates/manifest",
  "crates/hub",
  "crates/host",
  "crates/native",
  "crates/codegen",
  "bindings/wasm",
  "bindings/c",
  "bindings/uniffi",
  "bindings/node",
  "bindings/hub-c",
  "bindings/hub-uniffi",
  "bindings/hub-node",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stareing/appwire"
homepage = "https://github.com/stareing/appwire"
keywords = ["mcp", "model-context-protocol", "ai-agent", "llm", "tool-calling"]
categories = ["development-tools", "api-bindings"]

[workspace.dependencies]
app-mcp-protocol = { path = "crates/protocol" }
app-mcp-core = { path = "crates/core" }
app-mcp-manifest = { path = "crates/manifest" }
app-mcp-native = { path = "crates/native" }
app-mcp-hub = { path = "crates/hub" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures = "0.3"
rmcp = "3.5"
jsonschema = "0.58"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rand = "0.9"
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1"
uniffi = "0.32"
napi = { version = "3", default-features = false }
napi-derive = "3"
napi-build = "2"

# 开发 / 测试：调试信息只保留行号（panic 回溯仍有文件与行号），依赖不带调试信息——测试程序多（hub 等几十个集成测试），
# 全量调试信息让每次链接与写盘（仓库在 /mnt/d，WSL 小文件 IO 慢）成为主要耗时。需要调试器看变量时临时设
# CARGO_PROFILE_DEV_DEBUG=2。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# uniffi 绑定的本机库（JVM jar / Python / Swift 随包的 .so）：release 优化，但只去调试信息、保留符号表——
# uniffi-bindgen 从符号表读取 UniFFI 元数据（strip = true 会报 "No UniFFI metadata found"）。
[profile.bindings-release]
inherits = "release"
strip = "debuginfo"

# 移动端 .so（Android jniLibs）：体积优先。panic 保持 unwind——uniffi 在 FFI 边界 catch_unwind，
# 把 panic 转成 InternalException 抛给 Kotlin，abort 会直接杀掉 App 进程。
[profile.mobile-release]
inherits = "release"
opt-level = "s"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
