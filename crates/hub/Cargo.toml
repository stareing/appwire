[package]
name = "app-mcp-hub"
description = "AppWire Hub: embeddable library that routes AI agent tool calls (MCP, OpenAI, Anthropic, Gemini) to local apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
name = "app_mcp_hub"
path = "src/lib.rs"

# 可选能力（spec/hub-api.md「cargo features」）。默认全开，与拆分前行为相同；移动端绑定按需关闭以缩小体积。
# 关闭后公开配置字段与方法保持不变，请求被关闭的能力时返回 `ErrorKind::Unsupported`（见 src/features.rs）。
[features]
default = ["mcp-server", "upstream", "schema-validation", "dbus"]
# MCP 出口：`/mcp`（Streamable HTTP，`HubConfig::mcp_http`、`Hub::serve_http(_with)`）、`Hub::serve_stdio`、`McpSession`。
mcp-server = ["rmcp/transport-io", "rmcp/transport-streamable-http-server"]
# 上游聚合：以子进程启动其他 MCP 服务器并汇入工具（`HubConfig::upstreams`）。
upstream = ["rmcp/transport-child-process"]
# 调用前按工具的 inputSchema 校验参数（jsonschema 及其正则引擎）；关闭时参数原样交给 App。
schema-validation = ["dep:jsonschema"]
# 名字服务连接器（spec/naming.md 4.1）：Linux D-Bus 会话总线上的发现与按名拨号（`connector::DbusConnector`）。
dbus = ["dep:zbus"]

[dependencies]
app-mcp-protocol.workspace = true
app-mcp-manifest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
rand.workspace = true
# 模型类型与 Peer（MCP 会话通知、上游调用）总是需要；传输按 feature 引入（见 [features]）。
rmcp = { workspace = true, features = ["server", "client"] }
# Streamable HTTP：用 hyper 直接提供 HTTP 服务（rmcp 的 StreamableHttpService 是 tower 服务）。
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
http = "1"
# 不启用默认特性：不需要按 $ref 远程拉取 schema（resolve-http 会引入 reqwest / aws-lc-rs，
# 也不希望 App 提供的 schema 触发网络或本地文件访问）。
jsonschema = { version = "0.58", default-features = false, optional = true }
# App 总览版本号（spec/protocol.md 第 7 节）、导出名哈希后缀。
sha2 = "0.10"
# 审批 / 配对回调（spec/hub-api.md 3.3）：dyn 兼容的 async trait。
async-trait = "0.1"

# D-Bus 连接器（feature `dbus`）：纯 Rust，跑在 Hub 的 tokio 运行时上。
# @why 鸿蒙（`*-linux-ohos`）也是 target_os = "linux"，但没有 D-Bus 会话总线：排除。
[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }

# 单实例锁（instance.rs）：Unix flock。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows：AUMID 唤醒经 IApplicationActivationManager::ActivateApplication 传入令牌参数；
# 单实例锁用 LockFileEx（windows-sys，与 app-mcp-protocol 同一版本）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
# 按名寻址（connector::PipeConnector）：管道服务端进程（Pipes / Threading）、登记目录变更通知（FileSystem / IO / Security）。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
# test-support：tests/naming.rs 用私有 D-Bus 会话总线（test_bus）与示例程序构建（test_support::example_path）。
app-mcp-native = { workspace = true, features = ["test-support"] }
tokio-tungstenite.workspace = true
rmcp = { workspace = true, features = ["client", "transport-io"] }
# tests/mcp_ipc.rs：经本地 IPC 发 HTTP 请求（/status、Windows 上的 /mcp）。
hyper = { version = "1", features = ["client", "http1"] }

# tests/mcp_ipc.rs：Unix 上用 rmcp 自带的 Unix 域套接字 HTTP 客户端连接 IPC 上的 /mcp。
[target.'cfg(unix)'.dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-unix-socket"] }

# 依赖 MCP 出口的集成测试（关闭 mcp-server 时跳过）。
[[test]]
name = "mcp_ipc"
required-features = ["mcp-server"]
