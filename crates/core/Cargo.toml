[package]
name = "app-mcp-core"
description = "AppWire sans-IO client core: tool registry, scopes, call queue and connection state machine for MCP app SDKs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
app-mcp-protocol.workspace = true
# @why serde / serde_json 不经 workspace 继承：workspace 版本带 std 默认特性，无法在成员里关掉。
# WASM 依赖图（protocol、core、wasm 绑定）只用 alloc，免去 io::Error 等 std 代码（gzip 约 -1.8 KB）；
# 原生构建中其他成员经 workspace 打开 std，特性合并后行为不变。
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror.workspace = true

# 热路径基准（TASKS 第 10 项）：`cargo bench -p app-mcp-core --bench hot_path`；自定义计数分配器，无额外依赖。
[[bench]]
name = "hot_path"
harness = false
