[package]
name = "app-mcp-protocol"
description = "AppWire SDK-to-Hub protocol types (JSON-RPC messages and error codes)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# @why serde / serde_json 不经 workspace 继承：workspace 版本带 std 默认特性，无法在成员里关掉。
# WASM 依赖图（protocol、core、wasm 绑定）只用 alloc，免去 io::Error 等 std 代码（gzip 约 -1.8 KB）；
# 原生构建中其他成员经 workspace 打开 std，特性合并后行为不变。
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "raw_value"] }
thiserror.workspace = true
sha2 = "0.10"

# 本地 IPC 身份辅助（endpoint 模块）：Unix 取有效用户 ID；Windows 取用户 SID、管道所有者、安全描述符。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
