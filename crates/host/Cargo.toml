[package]
name = "app-mcp-host"
description = "AppWire Host: local MCP server that exposes the tools of every app on the device to Claude, ChatGPT, Gemini and other MCP clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mcp", "mcp-server", "model-context-protocol", "ai-agent", "claude"]
categories.workspace = true

[lib]
name = "app_mcp_host"
path = "src/lib.rs"

[[bin]]
name = "app-mcp-host"
path = "src/main.rs"
test = false

# Windows 上的无控制台窗口版本（GUI 子系统），供登录启动项运行 `serve`；其他平台与 app-mcp-host 相同。
[[bin]]
name = "app-mcp-hostw"
path = "src/bin/app-mcp-hostw.rs"
test = false
doc = false

# 仅供集成测试使用的最小上游 MCP 服务器（集成测试通过 CARGO_BIN_EXE_app-mcp-test-upstream 启动）。
[[bin]]
name = "app-mcp-test-upstream"
path = "tests/support/test_upstream.rs"
test = false
doc = false

[dependencies]
app-mcp-hub.workspace = true
app-mcp-protocol.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
rand.workspace = true
# setup：Agent 配置文件指纹（卸载时判断文件自写入后是否变化）；与 app-mcp-protocol 同版本。
sha2 = "0.10"
# 以下仅 test_upstream 可执行程序使用。
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde_json.workspace = true

# doctor：进程是否存在（kill(pid, 0)）。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 登录启动项：HKCU\Software\Microsoft\Windows\CurrentVersion\Run（无需管理员）；
# doctor：端口占用进程（GetExtendedTcpTable）、进程名与存活（OpenProcess / QueryFullProcessImageNameW）。
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_NetworkManagement_IpHelper",
  "Win32_System_Threading",
] }

[dev-dependencies]
app-mcp-manifest.workspace = true
app-mcp-native.workspace = true
futures.workspace = true
tokio-tungstenite.workspace = true
rmcp = { workspace = true, features = ["client", "transport-io", "transport-streamable-http-client-reqwest"] }
